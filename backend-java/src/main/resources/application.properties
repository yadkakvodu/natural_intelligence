spring.application.name=natural-intelligence

server.port=${SERVER_PORT:8080}

# DB: values are overridden by docker-compose / environment
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/natural_intelligence}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema is created from db/backup.sql.gz, never by Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Spring Boot 3.3 disables bean definition overriding by default; keep it strict
spring.main.allow-bean-definition-overriding=false

# AI Core (Python) base URL
python.ai.url=${PYTHON_AI_URL:http://localhost:8000}

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
